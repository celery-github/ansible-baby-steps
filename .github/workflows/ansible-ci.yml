name: Ansible CI

on:
  push:
    branches:
      - develop
  #workflow_dispatch:

jobs:
  run-ansible:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint
     
      - name: Show environment before
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Home directory:"
          ls -la $HOME

      - name: Check Ansible version
        run: ansible --version

      - name: Lint playbook
        run: ansible-lint playbooks/bootstrap.yml

      - name: Show environment after
        run: |
            echo "HOME is: $HOME"
            echo "Searching for ansible-demo..."
            find /home/runner -type d -name "ansible-demo" 2>/dev/null || true

      - name: Run playbook
        run: ansible-playbook playbooks/bootstrap.yml
